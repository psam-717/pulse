spring.application.name=demo
# Render injects a random free port via $PORT; local default stays 8080
server.port=${PORT:8080}

# Local dev secrets live in application-local.properties (gitignored — see .env.example).
# Hosted platforms provide everything via env vars (DB_URL/DB_USERNAME/DB_PASSWORD/JWT_SECRET).
spring.profiles.active=local

# DB — override via env on hosted platforms (Render/Neon), local defaults below
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pulse_db}
spring.datasource.username=${DB_USERNAME:postgres}
# NO default on purpose: never commit a database password. Set DB_PASSWORD (env) or
# application-local.properties (local dev).
spring.datasource.password=${DB_PASSWORD}

# Optional but very useful for development:
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (override in production — NO default: a known secret = forgeable tokens)
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# File Upload Configuration
file.upload.dir=uploads/licenses
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI / Swagger UI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true

# Aza payments (P4). Leave AZA_API_KEY unset to use the mock gateway.
aza.api-key=${AZA_API_KEY:}
aza.base-url=${AZA_BASE_URL:https://api.aza.systems}
aza.webhook-secret=${AZA_WEBHOOK_SECRET:}

# Staff login 2FA (web dashboard)
otp.expiry-minutes=5
otp.max-attempts=5

# Arkesel SMS (patient OTP delivery). Real SMS is sent only when ARKESEL_REAL
# is true AND a key + sender ID are set; otherwise codes are dev-logged
# (otp.dev-mode stays independent so staff 2FA echo is never affected).
arkesel.api-key=${ARKESEL_API_KEY:}
arkesel.sender=${ARKESEL_SENDER_ID:}
arkesel.sandbox=${ARKESEL_SANDBOX:false}
arkesel.send-real=${ARKESEL_REAL:false}
# Resend email delivery for staff reset codes (web forgot-password). Same
# gating philosophy as Arkesel: EMAIL_REAL=false → dev-echo/log only.
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:Pulse <no-reply@pulselabs.tech>}
resend.send-real=${EMAIL_REAL:false}
# Allowed browser origins for CORS (comma-separated). Add deployed web
# origins here via the CORS_ALLOWED_ORIGINS env var (Render).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081,http://127.0.0.1:8081,https://pulse-web-wheat.vercel.app,https://pulse-web-housebuoys-projects.vercel.app,https://pulselabs.tech,https://www.pulselabs.tech}
# Dev convenience: echo the code in the login response. Keep true while the team
# tests without a real email service; flip OTP_DEV_MODE=false before real launch.
otp.dev-mode=${OTP_DEV_MODE:true}
